[project]
name = "holdline"
version = "0.1.0"
description = "A Strands voice agent that makes the phone calls you dread: navigates the IVR, waits on hold, talks to the rep, and interrupts you only for a real decision."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Voice core. `bidi` = Nova Sonic (primary); `bidi-openai` = OpenAI Realtime
    # (documented fallback provider). Pinned exactly — bidi is an experimental,
    # fast-moving API surface. Verified against this version on Day 1.
    "strands-agents[bidi,bidi-openai]==1.54.0",
    "strands-agents-tools==0.8.8",
    # Telephony bridge
    "twilio",
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    # Audio resampling (mu-law 8k <-> PCM 16k/24k). audioop-lts backports the stdlib
    # module removed in 3.13; on 3.12 the stdlib audioop is still present.
    "numpy",
    # State + config
    "boto3",
    "python-dotenv",
    "structlog",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
# Local mic spike only (not needed on the server / AgentCore path).
mic = ["strands-agents[bidi-pyaudio]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
